title: PikaORM Documentation
description: >-
  The lightweight MicroORM for Java — no config files, no magic,
  just clean builder-style API over plain SQL.
url: "https://pika.cs.montana.edu"
baseurl: ""

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

permalink: pretty

# Exclude non-site files from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - TODO.md
  - PikaMethods.md

# Accent color — change this one value to retheme the site
accent_color: "#5b5bd6"
