<nav class="sidebar-left" id="sidebar-left" aria-label="Documentation navigation">
  <button
    id="sidebar-collapse-btn"
    class="sidebar-collapse-btn"
    type="button"
    aria-label="Collapse sidebar"
    aria-expanded="true"
    aria-controls="sidebar-left"
  >
    <svg class="sidebar-collapse-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  {% for section in site.data.nav %}
  <div class="nav-section">
    <div class="nav-section-header">
      <a class="nav-section-title" href="{{ section.pages[0].url | relative_url }}">{{ section.category }}</a>
      <button
        class="nav-section-toggle"
        aria-expanded="true"
        aria-controls="nav-section-{{ section.id }}"
        data-section-id="{{ section.id }}"
        aria-label="Toggle {{ section.category }} section"
      >
        <svg class="nav-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>
    <ul class="nav-links" id="nav-section-{{ section.id }}" role="list">
      {% for nav_page in section.pages %}
      <li>
        <a
          href="{{ nav_page.url | relative_url }}"
          class="nav-link{% if page.active_page == nav_page.active_page %} nav-link--active{% endif %}"
          {% if page.active_page == nav_page.active_page %}aria-current="page"{% endif %}
        >{{ nav_page.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</nav>
