<header class="topbar" role="banner">
  <div class="topbar-left">
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="true"
      aria-controls="sidebar-left">
      <span class="toggle-bar"></span>
      <span class="toggle-bar"></span>
      <span class="toggle-bar"></span>
    </button>
    <a href="{{ '/' | relative_url }}" class="topbar-brand" aria-label="PikaORM home">
        <div class="svg-container topbar-logo"></div>
      <span class="topbar-name">PikaORM</span>
    </a>

    <nav class="topbar-nav" aria-label="Global">
      {% for section in site.data.nav %}{% unless section.top_nav == false %}
      <a href="{{ section.pages[0].url | relative_url }}" class="topbar-nav-link">{{ section.category }}</a>
      {% endunless %}{% endfor %}
    </nav>
  </div>

  <div class="topbar-right">
    <nav class="topbar-nav topbar-nav-end" aria-label="External">
      <a href="{{ 'pages/changelog/' | relative_url }}" class="topbar-nav-link" rel="noopener noreferrer">Changelog</a>
      <a href="https://github.com/msu/pika-orm" class="topbar-nav-link" rel="noopener noreferrer">GitHub</a>
      <a href="https://opensource.cs.montana.edu" class="topbar-nav-link" rel="noopener noreferrer">OS@MSU</a>
    </nav>

    <!-- Search -->
    <div class="search-wrap" id="search-wrap">
      <button class="search-trigger" id="search-trigger" aria-label="Open search" aria-expanded="false"
        aria-controls="search-modal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <span>Search</span>
        <kbd class="search-kbd">⌘K</kbd>
      </button>
    </div>
  </div>
</header>

<!-- Search Modal -->
<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search documentation" hidden>
  <div class="search-modal-backdrop" id="search-modal-backdrop"></div>
  <div class="search-modal-box">
    <div class="search-input-row">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="search" id="search-input" class="search-input" placeholder="Search documentation…" autocomplete="off"
        spellcheck="false" aria-label="Search documentation">
      <button class="search-close" id="search-close" aria-label="Close search">
        <kbd>Esc</kbd>
      </button>
    </div>
    <div class="search-results" id="search-results" role="listbox" aria-label="Search results">
      <p class="search-hint">Type to search across all pages…</p>
    </div>
  </div>
</div>
