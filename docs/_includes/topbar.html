<header class="topbar" role="banner">

      <span class="toggle-bar"></span>

<!-- Search Modal -->
<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search documentation" hidden>
  <div class="search-modal-backdrop" id="search-modal-backdrop"></div>
  <div class="search-modal-box">
    <div class="search-input-row">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="search" id="search-input" class="search-input" placeholder="Search documentation…" autocomplete="off"
        spellcheck="false" aria-label="Search documentation">
      <button class="search-close" id="search-close" aria-label="Close search">
        <kbd>Esc</kbd>
      </button>
    </div>
    <div class="search-results" id="search-results" role="listbox" aria-label="Search results">
      <p class="search-hint">Type to search across all pages…</p>
    </div>
  </div>
</div>
