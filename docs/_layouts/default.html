<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include topbar.html %}

  <div class="layout-shell">
    {% include sidebar-left.html %}

    <div class="layout-center">
        {% include sidebar-page-navigate.html %}
      <main class="prose" id="main-content" tabindex="-1">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>

    {% include sidebar-right.html %}
  </div>

  <!-- Mermaid -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    // Convert kramdown's <pre><code class="language-mermaid"> blocks to <div class="mermaid">
    document.querySelectorAll('pre code.language-mermaid').forEach(function(codeEl) {
      var pre = codeEl.parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = codeEl.textContent;
      pre.parentNode.replaceChild(div, pre);
    });

    mermaid.initialize({
      startOnLoad: true,
      theme: 'base',
      themeVariables: {
        primaryColor: '#ededfc',
        primaryTextColor: '#1c1c2e',
        primaryBorderColor: '#5b5bd6',
        lineColor: '#5b5bd6',
        secondaryColor: '#f5f5ff',
        tertiaryColor: '#fafafa',
        background: '#ffffff',
        mainBkg: '#ededfc',
        nodeBorder: '#5b5bd6',
        clusterBkg: '#f5f5ff',
        titleColor: '#1c1c2e',
        edgeLabelBackground: '#ffffff',
        fontFamily: 'Inter, system-ui, sans-serif',
        fontSize: '14px'
      }
    });
  </script>

  <!-- Main JS: sidebar toggle, TOC builder, search -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
